# API gateway – ประตูหน้าของระบบที่แยกส่วนแล้ว (ตำรา บท 17: API layer / gateway)
server {
    listen 80;
    server_tokens off;

    # ตรวจว่า gateway เองยังมีชีวิต (ใช้กับ deploy_check และ healthcheck)
    location = /health {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # TODO (L5): ส่ง /api/menu ไปที่ menu-service – เมนูคือข้อมูลของ menu เท่านั้น
    location /api/menu { 
        proxy_pass http://menu:8000; 
    }

    # TODO (L5): ส่ง /api/orders ไปที่ order-service
    location /api/orders { 
        proxy_pass http://order:8000; 
    }

    # หน้าแรก: ระบบแยกส่วนนี้มีแต่ API – บอกทางไป Swagger ของแต่ละ service ภายหลัง
    location = / {
        default_type text/plain;
        return 200 "CanteenGo (split): ลอง /api/menu และ /api/orders\n";
    }
}